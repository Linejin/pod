<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pod 모바일</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header><h1>Pod</h1><button id="refresh" type="button">새로 읽기</button></header>
  <p id="status" role="status">연결 대기</p>
  <main>
    <section aria-label="작업 목록"><h2>작업</h2><div id="tasks"></div><button id="more" hidden>다음 목록</button></section>
    <section aria-label="작업 상세"><h2>상세</h2><div id="detail"></div><div id="gates"></div></section>
    <section aria-label="결정"><h2>결정</h2><p>최종 확인은 기기에서 합니다.</p><label>선택 <select id="choice"></select></label><label>결정 <select id="decision"><option value="approve">승인</option><option value="reject">거절</option></select></label><button id="decide" disabled>기기에서 확인</button></section>
    <section aria-label="메시지"><h2>짧은 메시지</h2><p>에이전트에 지시를 보냅니다. 1000자 · 4096바이트 · 20줄</p><label for="message">내용</label><textarea id="message" rows="4"></textarea><button id="send" disabled>보내기</button></section>
    <section aria-label="출력"><h2>출력</h2><button id="output" disabled>출력 읽기</button><pre id="lines"></pre></section>
    <section aria-label="전달 상태"><h2>전달</h2><button id="delivery" disabled>상태 읽기</button><pre id="deliveryStatus"></pre></section>
  </main>
</body>
</html>
