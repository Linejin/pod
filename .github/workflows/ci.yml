# Pod CI (quality-01). Windows is the only supported platform; the `linux`
# job only compile-checks the mobile LAN crate's OpenSSL backend (docs/23
# section 2, card M2-F0b).
#
# Not active yet: pushing this file needs a GitHub token with the `workflow`
# scope, which the current one lacks (see CONTRIBUTING.md "CI").
#
# Plain cargo commands build the workspace default-members = every shipped
# crate; the UI/diff spikes are left out on purpose (Cargo.toml, quality-14).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Repository policy checks (no cargo)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($s in "check-workspace", "check-docs", "check-boundaries", "check-vendor-notices", "test-publish-public") {
            powershell -NoProfile -ExecutionPolicy Bypass -File "tools/$s.ps1"
            if ($LASTEXITCODE -ne 0) { throw "$s failed" }
          }
          # TM-04: synthetic closures with a forbidden or missing license,
          # OR/AND cases, an excluded TLS crate (rustls, ring, subtle...),
          # the wrong stack per target or a changed file must fail.
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/check-mobile-licenses.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { throw "check-mobile-licenses -SelfTest failed" }

      - name: Mobile bundled assets and Edge security (no cargo)
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/check-mobile-assets.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { throw "mobile asset self-test failed" }
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/check-mobile-assets.ps1
          if ($LASTEXITCODE -ne 0) { throw "mobile assets failed" }
          # A file, not the directory: Node 22 (the runner's) resolves a
          # directory argument as a module instead of searching it.
          node --test mobile/tests/security.test.mjs
          if ($LASTEXITCODE -ne 0) { throw "mobile Edge security failed" }

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: Bundled ConPTY (pinned version and SHA-256)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/fetch-conpty.ps1

      - name: cargo clippy
        run: cargo clippy --workspace --exclude pod-spike --exclude diff-spike --all-targets --locked -- -D warnings

      # Doc comments of the daemon: a link to a private item or an ambiguous
      # name (module vs macro) fails here instead of rotting silently.
      - name: cargo doc (podd)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc -p podd --no-deps --locked

      # pod-cli integration tests run the podd / pod-holder / pod-hook
      # executables next to pod.exe, so build every binary first.
      - name: cargo build
        run: cargo build --workspace --exclude pod-spike --exclude diff-spike --locked

      # podd's build.rs puts the bundled ConPTY next to pod-holder. If it does
      # not (cargo 1.100 moved build script output), the holder silently uses
      # the inbox ConPTY and terminal tests fail far away from the cause.
      - name: Bundled ConPTY next to the binaries
        shell: pwsh
        run: |
          foreach ($f in "target/debug/conpty.dll", "target/debug/x64/OpenConsole.exe") {
            if (-not (Test-Path $f)) { throw "$f missing: podd build.rs did not copy vendor/conpty" }
          }

      # POD_REQUIRE_TOOLS=1: a test that would skip because a tool is missing
      # fails instead (quality-07). Codex is not installed on the runner, so
      # its one test is skipped by name here, visibly.
      - name: cargo test
        env:
          POD_REQUIRE_TOOLS: "1"
        run: cargo test --workspace --exclude pod-spike --exclude diff-spike --locked -- --skip codex_hooks_trusted_via_app_server_in_temp_home

      # docs/23 section 7 / card M2-F0b: the default-off `mobile-lan` closure
      # (SChannel/CNG through windows-sys; the system OpenSSL 3 on Linux)
      # matches the reviewed docs/mobile-m2/sbom.json under the strict license
      # policy, default builds stay TLS-free, and the feature build and its
      # loopback TLS tests pass. The tests create per-user CNG keys under a
      # test prefix and delete them; nothing listens beyond 127.0.0.1.
      - name: Mobile LAN license gate and feature build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cargo fetch --locked
          if ($LASTEXITCODE -ne 0) { throw "cargo fetch failed" }
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/check-mobile-licenses.ps1
          if ($LASTEXITCODE -ne 0) { throw "check-mobile-licenses failed" }
          cargo clippy -p pod-mobile --features mobile-lan --all-targets --locked -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw "clippy (mobile-lan) failed" }
          cargo test -p pod-mobile --features mobile-lan --locked
          if ($LASTEXITCODE -ne 0) { throw "pod-mobile tests (mobile-lan) failed" }
          cargo check -p podd --features mobile-lan --locked
          if ($LASTEXITCODE -ne 0) { throw "podd check (mobile-lan) failed" }

  # The OpenSSL 3 backend of pod-mobile (Linux daemon target, docs/23 section
  # 2): compile and lint gate. Its runtime is unverified in M2; the test step
  # below reports without failing the job until a Linux owner reviews it.
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: System OpenSSL 3 (headers for openssl-sys; linked dynamically)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libssl-dev pkg-config
          openssl version

      - name: cargo check / clippy (pod-mobile, mobile-lan)
        run: |
          cargo check -p pod-mobile --features mobile-lan --all-targets --locked
          cargo clippy -p pod-mobile --features mobile-lan --all-targets --locked -- -D warnings

      - name: pod-mobile tests (informational, runtime unverified)
        continue-on-error: true
        run: cargo test -p pod-mobile --features mobile-lan --locked

  # cargo-deny-action is a container action (Linux runners only); the policy
  # itself targets x86_64-pc-windows-msvc (deny.toml [graph]).
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
