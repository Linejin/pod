[package]
name = "pod-remote"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Remote machines for Pod: SSH machine profiles and the system-ssh transport (docs/17 R3)"

[dependencies]
# Client side only: pod-client under the old name, so `podd::client` still
# reads (card D-T1).
podd = { package = "pod-client", path = "../pod-client" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# Shared test helpers (git, condition waits, missing tools); tests only.
pod-test-support = { path = "../pod-test-support" }

[lints]
workspace = true
