[package]
name = "pod-a2a"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Agent2Agent (A2A) 1.0 client: Agent Card discovery, JSON-RPC 2.0 binding, bounded HTTPS transport"

# Client only (docs/a2a-client.md): no listener, no server, no streaming. The wire
# model mirrors the release-tagged spec/a2a.proto of A2A v1.0.1 in canonical
# ProtoJSON; the transport is one bounded HTTP/1.1 exchange per call over
# rustls with the OS trust store. Every crate below was already in Cargo.lock
# through the GPUI stack (gpui-pre-reqwest -> hyper-rustls) or podd/pod-cli,
# so this crate adds no new third-party package to the lock; the TLS features
# match the ones already resolved there (ring provider, no aws-lc-rs).
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Raw (`bytes`) parts are base64 in ProtoJSON: decoded to check them, never saved.
base64 = "0.22"
# Message ids (UUID v4) for client-created messages.
uuid = { version = "1.29", features = ["v4"] }
# The HTTP/1.1 client connection (no pool, no proxy, no redirect following).
http = "1.5"
hyper = { version = "1.12", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio"] }
http-body-util = "0.1.5"
bytes = "1.12"
# A private current-thread runtime per client: callers stay blocking.
tokio = { version = "1.54", default-features = false, features = ["rt", "net", "time"] }
# TLS: ring provider only (default features would add aws-lc-rs).
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
# The OS trust store (Windows: the system certificate stores).
rustls-native-certs = "0.8.5"

[lints]
workspace = true
