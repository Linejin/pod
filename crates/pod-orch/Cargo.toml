[package]
name = "pod-orch"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Orchestration core for Pod (docs/19 S4): runs, work items (DAG), attempts with token and generation fences, append-only mail, idempotent requests"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
# MIT OR Apache-2.0: attempt tokens are stored only as SHA-256 hashes.
sha2 = "0.10"
# Leaf crate: the temporary-file + rename JSON write.
pod-storage = { path = "../pod-storage" }

[lints]
workspace = true
