[package]
name = "pod-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Pod desktop app (P2 UI MVP): GPUI client of the podd daemon"

[[bin]]
name = "pod-app"
path = "src/main.rs"

[dependencies]
# MIT/Apache-2.0; GPUI already uses this handle interface.
raw-window-handle = "0.6"
gpui-kit = "0.9.0"
# Already used by gpui-component; MIT. Supplies the host Korean catalog.
rust-i18n = "4.2.4"
pod-terminal-view = { path = "../pod-terminal-view" }
pod-diff = { path = "../pod-diff" }
# Design system (status badges, tree rows, frames) for the P5 orchestration UI.
pod-ui = { path = "../pod-ui" }
pod-status = { path = "../pod-status" }
# Agent text as data and its provenance (O1): no new third-party deps.
pod-orch = { path = "../pod-orch" }
# P3 editing: file tree, quick open, editor tabs and LSP per task worktree.
pod-editor = { path = "../pod-editor" }
# Client side only: protocol types + blocking client with daemon auto-start.
# pod-client under the old name, so `podd::client` still reads (card D-T1).
podd = { package = "pod-client", path = "../pod-client" }
# P6 PR section fixtures (the fake forge; the app never runs gh itself).
pod-forge = { path = "../pod-forge" }
# Remote machines (docs/17 R3/R4): profiles, system-ssh transport, reconnecting sessions.
pod-remote = { path = "../pod-remote" }
anyhow = "1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_IO", "Win32_UI_WindowsAndMessaging", "Win32_System_Diagnostics_Debug", "Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_System_Registry", "Win32_System_SystemInformation"] }
# MIT/Apache-2.0, already in the tree through GPUI: WinRT toasts for mod notices (os_notify.rs).
windows = { version = "0.62", features = ["Data_Xml_Dom", "Foundation", "UI_Notifications"] }

[lints]
workspace = true

[dev-dependencies]
# Headless GPUI test platform: native-QA interaction tests (keyboard, focus, IME, DPI).
gpui = { package = "gpui-pre", version = "=0.3.11", features = ["test-support"] }
tempfile = "3"
# Loopback fault proxy for the remote-machine tests (dev only).
pod-test-support = { path = "../pod-test-support" }

[build-dependencies]
# MIT: compiles per-binary Windows resources without leaking through rlibs.
embed-resource = "3.0.12"
