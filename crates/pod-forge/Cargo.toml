[package]
name = "pod-forge"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Forge (GitHub) operations for Pod tasks: detect the remote, push, pull requests and checks through the gh CLI, plus a fake forge for tests"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
# Leaf crates (docs/20-refactor/libs.md §2): the bounded runner and the
# temporary-file + rename JSON write.
pod-process = { path = "../pod-process" }
pod-storage = { path = "../pod-storage" }

[lints]
workspace = true
