[package]
name = "pod-mods"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Pod extensions: sandboxed QuickJS mods (events, palette commands, status detectors) and layout presets"

[dependencies]
# MIT. Default `std` only: no quickjs-libc `std`/`os` modules, no loader. QuickJS
# assertions are compiled out so an engine assert cannot abort podd.
rquickjs = { version = "0.14", features = ["disable-assertions"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
# Leaf crate: the temporary-file + rename JSON write of the mod state (the
# manager, so only with `runtime`).
pod-storage = { path = "../pod-storage", optional = true }

[features]
# The QuickJS sandbox and the mod thread. Off for daemon clients that only
# need the wire types.
default = ["runtime"]
runtime = ["dep:rquickjs", "dep:pod-storage"]

[dev-dependencies]
tempfile = "3"
# Shared test helpers (git, condition waits, missing tools); tests only.
pod-test-support = { path = "../pod-test-support" }

[lints]
workspace = true
