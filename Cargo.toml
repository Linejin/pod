[workspace]
resolver = "3"
members = ["crates/pod-spike", "crates/podd", "crates/pod-cli", "crates/pod-status", "crates/pod-hook", "crates/pod-terminal-view", "crates/pod-app", "crates/diff-spike", "crates/pod-ui", "crates/pod-diff", "crates/pod-editor", "crates/pod-forge", "crates/pod-mods", "crates/pod-remote", "crates/pod-discover", "crates/pod-orch", "crates/pod-process", "crates/pod-storage", "crates/pod-test-support"]
# The UI/diff spikes (docs/02, docs/05) stay buildable with `-p pod-spike` /
# `-p diff-spike` but are left out of plain `cargo build/test/clippy` (and CI):
# nothing ships them and they only add build time (quality-14).
default-members = ["crates/podd", "crates/pod-cli", "crates/pod-status", "crates/pod-hook", "crates/pod-terminal-view", "crates/pod-app", "crates/pod-ui", "crates/pod-diff", "crates/pod-editor", "crates/pod-forge", "crates/pod-mods", "crates/pod-remote", "crates/pod-discover", "crates/pod-orch", "crates/pod-process", "crates/pod-storage", "crates/pod-test-support"]

[patch.crates-io]
# Apache-2.0 toolkit; accessibility fixes are recorded in vendor/gpui-component/POD-PATCHES.md.
gpui-component = { path = "vendor/gpui-component" }

[workspace.package]
# Pod release version: the installer and portable zip are named after it
# (tools/installer/build.ps1). Crates keep their own versions.
version = "0.1.0"
edition = "2024"
# Toolchain used in development and CI; lower versions are untested (docs/14 §2.1).
rust-version = "1.99"
license = "Apache-2.0"

[profile.release]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

# Every shipped crate opts in with `[lints] workspace = true` (only the spikes
# pod-spike and diff-spike do not; tools/check-workspace.ps1 checks this).
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
undocumented_unsafe_blocks = "allow"
